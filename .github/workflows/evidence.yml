name: Validate experiment evidence
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate published records and media
        run: python scripts/analyze_results.py
      - name: Check byte-hashed inputs with Git checkout conversion enabled
        shell: bash
        run: |
          for evidence_file in configs/demonstration_split.json results/episodes.csv results/inference_seeds.csv results/pilot_replay.csv results/step800_runtime.csv; do
            git -c core.autocrlf=true cat-file --filters "HEAD:${evidence_file}" | cmp "${evidence_file}" -
          done
      - name: Recompute paired statistics and failure outcomes
        run: python scripts/analyze_results.py --report
      - name: Test evidence guards
        run: python -m unittest discover -s tests
